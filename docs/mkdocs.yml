site_name: refl
site_description: C++26 compile-time-reflection-based runtime reflection framework
repo_url: https://github.com/w2xel/refl
docs_dir: content
site_url: https://w2xel.github.io/refl/
watch:
  - ../tests

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.snippets:
      base_path: [!relative $config_dir/../tests]
      check_paths: true
      dedent_subsections: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Setup: getting-started/index.md
      - Runtime reflection: getting-started/runtime.md
      - Typed binding: getting-started/binding.md
      - Dynamic dispatch: getting-started/dynamic.md
      - Retained references: getting-started/references.md
      - Observation: getting-started/observation.md
  - Architecture:
      - Overview: architecture/index.md
      - Metadata and calls: architecture/contracts.md
      - Typed binding: architecture/typed-binding.md
      - Dynamic state: architecture/dynamic.md
      - Observation: architecture/observation.md
  - Contributing: contributing.md
