site_name: cpp_runtime_reflection
site_description: C++26 compile-time-reflection-based runtime reflection framework
repo_url: https://github.com/swuerl/cpp_runtime_reflection
docs_dir: content

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Design: design.md
  - Dyn: dyn.md
  - Architecture:
      - Overview: architecture/index.md
      - Repository assessment: architecture/assessment.md
      - "Layer 1: Contracts and values": architecture/contracts.md
      - "Layer 2: Reflection generation": architecture/generation.md
      - "Layer 3: Runtime services": architecture/runtime.md
      - "Layer 4: Typed binding": architecture/typed-binding.md
      - "Layer 5: Dynamic composition": architecture/dynamic.md
      - "Layer 6: Observation": architecture/observation.md
      - Migration and verification: architecture/migration.md
  - Getting Started: getting-started.md
